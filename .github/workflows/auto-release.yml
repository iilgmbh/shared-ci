name: "Auto-Release Action-Versionen"

# Merged gruene Dependabot-Bumps fremder Actions und setzt danach den naechsten
# Patch-Tag (platform#3775, Owner-Go 2026-10-05 "weg 2 ist ok go").
#
# Anlass: Jeder Action-Bump liess die Drift-Pruefung in jedem aufrufenden Repo
# einen Error melden, bis hier von Hand gemergt und getaggt war — ein Handgriff
# ohne Entscheidung. Was eine Entscheidung braucht, bleibt liegen und nennt den
# Grund im Log: Hauptversions-Spruenge, eigene Actions, jede andere Zeile, und
# ein Release, sobald zwischen Tag und main mehr als Versionszeilen liegt. Die
# Regeln stehen in tools/auto_release.py und sind dort getestet.
#
# Schreibrecht nur im geplanten bzw. von Hand gestarteten Lauf auf main. Jeder
# PR, der Werkzeug oder Workflow aendert, laeuft vorher trocken gegen das echte
# Repo — das Protokoll zeigt, was der scharfe Lauf taete.
#
# Der scharfe Lauf schreibt mit dem Token der App `iilgmbh-auto-release`, nicht
# mit GITHUB_TOKEN: Action-Bumps aendern nur Dateien unter .github/workflows/,
# und dafuer braucht es das Recht `workflows`, das GITHUB_TOKEN nie bekommt. Der
# erste scharfe Lauf am 2026-10-06 scheiterte genau daran (shared-ci#96, HTTP 403).
# Die App ist nur auf diesem Repo installiert, das Token lebt eine Stunde und
# wird am Jobende widerrufen. Anders als bei GITHUB_TOKEN loest der Merge die
# push-Workflows auf main aus.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts mergen oder taggen"
        type: boolean
        default: true
  pull_request:
    paths:
      - "tools/auto_release.py"
      - "tools/bot_review_kandidaten.py"
      - ".github/workflows/auto-release.yml"

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  trocken:
    name: "Auto-Release (Trockenlauf)"
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Probe der Kette App-ID, Schluessel und Installation, nur mit Leserecht.
      # Das Schreibrecht zeigt erst der scharfe Lauf.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.AUTO_RELEASE_APP_KEY }}
          permission-contents: read
      - run: python3 tools/auto_release.py --repo "$GITHUB_REPOSITORY" --dry-run
        env:
          GH_TOKEN: ${{ github.token }}

  scharf:
    name: "Auto-Release"
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.AUTO_RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - run: python3 tools/auto_release.py --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
