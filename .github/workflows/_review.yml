# _review.yml — Reusable: Review-Check Stufe 1 (Regel-Engine) fuer PRs.
#
# KONZ-platform-070 Z2 (platform#3903 WP2). Die Regeln sind Daten in
# platform registry/review-regeln.yaml; Engine und Lader liegen daneben
# (tools/review_engine.py, tools/review_regeln.py). Dieses Workflow haelt KEIN
# Regel-Literal (Kriterium K1): es checkt platform aus und ruft die Engine.
#
# Ausgabe: Annotations mit Datei:Zeile, Step-Summary, Artefakt review-befunde.json
# (Felder des Befund-Ledgers Z3). Pfad-BLOCK ("bleibt Mensch") ist ein Hinweis,
# kein Fehler. Nur mit blockieren=true faellt der Check bei BLOCK aus Inhalt/Umfang.
# Approve oder Request-Changes gibt der Check nie (Lotsen-Charta Art. 3).
#
# Aufrufer: _ci-python.yml (Job `review`, Schalter enable_review, Default aus).
name: _review

on:
  workflow_call:
    inputs:
      profil:
        description: "Review-Profil des Repos: default | deployed | library"
        type: string
        default: default
      blockieren:
        description: "BLOCK aus Inhalt/Umfang laesst den Check fallen (Pilot: false = advisory)"
        type: boolean
        default: false
      platform_repo:
        description: "Repo mit review-regeln.yaml und Engine (oeffentlich, kein Token)"
        type: string
        default: achimdehnert/platform
      platform_ref:
        description: "Ref des Regel-Repos"
        type: string
        default: main
      runs_on:
        description: "Runner-Label (Sekunden-Job, kein Repo-Code wird ausgefuehrt)"
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  review:
    name: "Review-Check (Regel-Engine)"
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - name: PR auschecken (voller Verlauf fuer den Diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Regeln und Engine auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: _platform
          sparse-checkout: |
            tools/review_engine.py
            tools/review_regeln.py
            registry/review-regeln.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Engine ausfuehren
        env:
          BASIS: ${{ github.event.pull_request.base.sha }}
          KOPF: ${{ github.event.pull_request.head.sha }}
          PROFIL: ${{ inputs.profil }}
          BLOCKIEREN: ${{ inputs.blockieren && '--blockieren' || '' }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          git fetch --quiet origin "$BASIS" "$KOPF"
          # shellcheck disable=SC2086
          python3 _platform/tools/review_engine.py --repo-pfad . \
            --basis "$BASIS" --kopf "$KOPF" --profil "$PROFIL" \
            --github --json review-befunde.json $BLOCKIEREN

      - name: Befunde als Artefakt (Ledger-Felder)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-befunde
          path: review-befunde.json
          if-no-files-found: ignore
          retention-days: 30
