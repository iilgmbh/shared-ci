name: "Secret Detection (Pflicht)"

# Pflicht-Workflow fuer Org-Rulesets (GK7, Owner "GK7go" 2026-10-20, dev-hub#530).
# Ein Ruleset der Regel-Art "workflows" verweist auf diese Datei. Damit laeuft
# gitleaks in jedem erfassten Repo auf jedem PR gegen den Default-Branch, auch in
# neu angelegten Repos, ohne dass dort eine Workflow-Datei liegt. Ersatz fuer
# GitHub Secret Protection in privaten Repos (ADR-226, Pflicht-Secret-Scan).
#
# Gleicher Scan wie in _ci-pypi.yml und der Vorlage platform
# docs/templates/secret-scan.yml: dieselbe gehaertete Composite-Action, per Tag
# gepinnt wie in der Vorlage (Sicherheits-Gate, kein schwimmender Verweis).

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: iilgmbh/shared-ci/.github/actions/gitleaks-scan@v1.1.29
