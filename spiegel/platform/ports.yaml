      aus platform#3337, serviert ueber die System-One-Schnittstelle als systemd-Nutzerdienst
      `kev.service` (Linger aktiv, ueberlebt Neustart). Bindet ausschliesslich auf
      127.0.0.1 — kein Ingress, auch nicht aus wg0, deshalb kein prod-Port und keine
      Domain. Umgezogen am 2026-09-21 von der gpu-box hierher (Owner-Frage "wieso
      4090 und nicht gx10?"). Der Knoten ist der erklaerte Inferenzknoten; die 4090
      traegt daneben den CI-Runner ci-gpu und hat nur 24 GB. Freigegeben wurden dort
      21 GB (22 -> 3,4 GB belegt). Speicherlage nach dem Umzug, gemessen: kev haelt
      18,2 GB. Der Knoten traegt ausserdem vLLM (37,5 GB), ollama, embedder und whisper-server
      — 121 GB gesamt, 68 belegt, 53 verfuegbar. Unified Memory: `frei` und `verfuegbar`
      weichen stark ab, die 53 sind die belastbare Zahl. Vor grossen Trainingslaeufen
      anhalten: `systemctl --user stop kev`.

      '
    prod_host: gx10
